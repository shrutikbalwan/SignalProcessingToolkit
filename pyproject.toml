[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-processing-toolkit"
dynamic = ["version"]
description = "Desktop tools for signal generation, analysis, processing, and visualization"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Shrutik Pradip Balwan", email = "shrutikbalwan@gmail.com" },
]
keywords = ["signal-processing", "dsp", "fft", "filters"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
gui = [
    "PyQt6>=6.6",
    "pyqtgraph>=0.13",
    "matplotlib>=3.8",
    "pydantic-settings>=2.1",
]
audio = [
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
]
image = ["opencv-python>=4.9"]
ai = [
    "onnx>=1.16",
    "onnxruntime>=1.17",
]
embedded = []
hardware = ["pyserial>=3.5"]
export = [
    "fpdf2>=2.7",
    "openpyxl>=3.1",
]
dev = [
    "black>=23.10",
    "build>=1.0",
    "hypothesis>=6.90",
    "isort>=5.13",
    "mypy>=1.7",
    "pydantic-settings>=2.1",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "pytest-qt>=4.4",
    "ruff>=0.1",
    "twine>=4.0",
]
docs = [
    "myst-parser>=2.0",
    "sphinx>=7.2",
    "sphinx-autodoc-typehints>=1.25",
    "sphinx-rtd-theme>=1.3",
]

[project.scripts]
spt = "signal_processing_toolkit.main:main"

[project.urls]
Homepage = "https://github.com/shrutikbalwan/SignalProcessingToolkit"
Repository = "https://github.com/shrutikbalwan/SignalProcessingToolkit.git"
Issues = "https://github.com/shrutikbalwan/SignalProcessingToolkit/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["signal_processing_toolkit*"]

[tool.setuptools.dynamic]
version = { attr = "signal_processing_toolkit._version.__version__" }

[tool.setuptools.package-data]
signal_processing_toolkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config --tb=short"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "ui: marks tests as UI tests requiring display",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv*",
    ".tmp",
    "dist",
    "build",
    "*.egg-info",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "pytest-cache-files-*",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "D", "T20", "S"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D107", "D203", "D213", "S101", "T201"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D100", "D104", "D107"]
"tests/test_embedded.py" = ["S603"]
"tools/*" = ["S603"]
"src/signal_processing_toolkit/ui/*" = ["D100", "D104"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "PyQt6.*",
    "pyqtgraph.*",
    "sounddevice",
    "soundfile",
    "serial.*",
    "cv2",
    "scipy.*",
    "openpyxl",
    "fpdf",
    "matplotlib",
    "onnxruntime.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "signal_processing_toolkit.ui.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = [
    "signal_processing_toolkit.dsp.generators.*",
    "signal_processing_toolkit.dsp.operations.*",
]
disallow_untyped_defs = false

[tool.coverage.run]
source = ["signal_processing_toolkit"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
precision = 2
